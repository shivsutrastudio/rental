<!DOCTYPE html>
<html>

<head>

<title>User Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 p-10">

<h1 class="text-3xl font-bold mb-6">
Saved Properties
</h1>

<div id="savedGrid"
class="grid md:grid-cols-3 gap-6"></div>

<script>

let saved=JSON.parse(localStorage.getItem("saved_properties"))||[]

let grid=document.getElementById("savedGrid")

saved.forEach(id=>{

let p=properties.find(x=>x.id===id)

grid.innerHTML+=`

<div class="bg-white shadow rounded p-4">

<img src="${p.images[0]}" class="h-40 w-full object-cover">

<h3 class="font-bold">${p.title}</h3>

<p>${p.location}</p>

</div>

`

})

</script>

</body>
</html>
