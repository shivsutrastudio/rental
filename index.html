<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShivSutra | Real Estate</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body class="bg-gray-100">

<!-- NAVBAR -->

<nav class="bg-[#0b1a35] text-white p-4 flex justify-between items-center">

<h1 class="text-xl font-bold">
ShivSutra
</h1>

<div class="flex gap-6 items-center">

<span id="userEmail" class="text-yellow-300"></span>

<button id="loginBtn"
onclick="window.location.href='login.html'">
Login
</button>

<button onclick="window.location.href='signup.html'">
Signup
</button>

<button id="logoutBtn"
onclick="logoutUser()"
style="display:none;">
Logout
</button>

<button onclick="openDashboard()">
Dashboard
</button>

<button onclick="openAdmin()">
Admin
</button>

</div>

</nav>

<!-- HERO -->

<section class="bg-[#122b5a] text-white text-center py-16">

<h2 class="text-4xl font-bold mb-4">
Find Your Perfect Property
</h2>

</section>

<!-- PROPERTY LIST -->

<section class="p-10">

<h2 class="text-3xl font-bold mb-6 text-center">
Available Properties
</h2>

<div id="propertyGrid"
class="grid md:grid-cols-3 gap-6 max-w-6xl mx-auto"></div>

</section>

<!-- MAP BELOW PROPERTIES -->

<section class="p-10 bg-white">

<h2 class="text-3xl font-bold mb-6 text-center">
Property Locations
</h2>

<div id="map"
style="height:500px;border-radius:10px"></div>

</section>

<!-- PROPERTY MODAL -->

<div id="propertyModal" class="modal">

<div class="modal-content">

<h2 id="modalTitle"></h2>

<img id="modalImage"
class="w-full h-60 object-cover rounded">

<div class="flex justify-between mt-2">

<button onclick="prevImage()">◀</button>

<button onclick="nextImage()">▶</button>

</div>

<p id="modalLocation"></p>

<p id="modalPrice"></p>

<p id="modalInfo"></p>

<a id="whatsappBtn"
target="_blank"
class="bg-green-500 text-white px-4 py-2 rounded mt-3 inline-block">

WhatsApp Enquiry

</a>

<button onclick="saveProperty(currentProperty)"
class="bg-yellow-500 text-black px-4 py-2 rounded mt-2">

Save Property

</button>

<h3 class="text-lg font-bold mt-4">
Recommended Properties
</h3>

<div id="recommendations"
class="grid grid-cols-3 gap-3 mt-2"></div>

<button onclick="closeModal()"
class="bg-gray-700 text-white px-4 py-2 mt-3 rounded">

Close

</button>

</div>

</div>

<!-- FOOTER -->

<footer class="bg-[#0b1a35] text-white p-8 text-center">

<p>
© 2026 ShivSutra Studio
</p>

</footer>

<!-- JS FILES -->

<script src="properties.js"></script>
<script src="app.js"></script>
<script src="maps.js"></script>
<script src="ai.js"></script>
<script src="admin.js"></script>

<script type="module" src="firebase.js"></script>

<script>

document.addEventListener("DOMContentLoaded",function(){

if(typeof displayProperties==="function"){
displayProperties(properties)
}

if(typeof initMap==="function"){
initMap()
}

})

</script>

</body>
</html>
