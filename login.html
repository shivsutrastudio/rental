<!DOCTYPE html>
<html lang="en">

<head>

<title>Login | ShivSutra</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-10 rounded shadow w-96">

<h2 class="text-2xl font-bold mb-6 text-center">
Sign in
</h2>

<input id="loginEmail"
type="email"
placeholder="Email"
class="border p-3 w-full mb-3 rounded">

<input id="loginPass"
type="password"
placeholder="Password"
class="border p-3 w-full mb-3 rounded">

<p id="loginError" class="text-red-500 text-sm mb-3 hidden"></p>

<button onclick="loginUser()"
class="bg-indigo-600 text-white w-full p-3 rounded hover:bg-indigo-700">

Login

</button>

<p class="text-center mt-4">

New here?

<a href="signup.html" class="text-indigo-600 hover:underline">
Create account
</a>

</p>

</div>

<script type="module" src="firebase.js"></script>

<script>
document.addEventListener("keypress",function(e){
if(e.key==="Enter"){
loginUser();
}
});
</script>

</body>
</html>
